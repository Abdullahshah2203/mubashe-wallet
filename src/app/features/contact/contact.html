<section class="contact-section">

  <div class="contact-container">

    <!-- TOP LABEL -->

    <p class="contact-label">
      MUBASHÉ / CONTACT
    </p>


    <!-- HEADING -->

    <h1>
      Let's talk
      <span>leather.</span>
    </h1>


    <!-- DESCRIPTION -->

    <p class="contact-description">
      Have a question about our wallets,
      need help choosing a piece, or want
      to place an order?
    </p>


    <!-- WHATSAPP BUTTON -->

    <button
      type="button"
      class="whatsapp-button"
      (click)="openWhatsApp()"
    >

      <span class="button-text">
        Chat on WhatsApp
      </span>

      <span class="button-arrow">
        →
      </span>

    </button>


    <!-- CONTACT INFO -->

    <div class="contact-info">

      <div class="info-item">

        <span class="info-label">
          WHATSAPP
        </span>

        <span class="info-value">
          Available for orders & enquiries
        </span>

      </div>


      <div class="info-item">

        <span class="info-label">
          RESPONSE
        </span>

        <span class="info-value">
          Usually within a few hours
        </span>

      </div>


      <div class="info-item">

        <span class="info-label">
          LOCATION
        </span>

        <span class="info-value">
          Pakistan
        </span>

      </div>

    </div>


    <!-- BRAND -->

    <div class="brand-mark">
      MUBASHÉ
    </div>

    <p class="brand-tagline">
      Premium Leather Wallets
    </p>

  </div>

</section>
